<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decorate Your Shelf</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Christmas Timer -->
  <div id="timer"></div>

  <!-- Shelf Container -->
  <div id="shelf-container">
    <img id="shelf-bg" src="assets/shelf-bg.png" alt="Shelf background">
    <div id="shelf-area"></div>
  </div>

  <!-- Toy Menu -->
  <div id="toy-menu">
    <img src="assets/bear.png" class="menu-toy">
    <img src="assets/dino.png" class="menu-toy">
    <img src="assets/deer.png" class="menu-toy">
    <img src="assets/croc.png" class="menu-toy">
    <img src="assets/duckglobe.png" class="menu-toy">
    <img src="assets/labubu.png" class="menu-toy">
    <img src="assets/nutcracker.png" class="menu-toy">
    <img src="assets/penguin.png" class="menu-toy">
    <img src="assets/snowglobe.png" class="menu-toy">
    <img src="assets/tree.png" class="menu-toy">
  </div>

  <!-- Shelf Name and Buttons -->
  <input type="text" id="shelf-name" placeholder="Shelf Name">
  <button id="save-shelf">Save Shelf</button>
  <button id="share-shelf">Share Shelf</button>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.29.0/dist/supabase.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
